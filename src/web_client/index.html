<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alpha</title>
    <!-- PWA: an installed (home screen) app is what iOS allows Web Push for. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="alpha" />
  </head>
  <body>
    <div id="root"></div>
    <!-- settings.js записывается нативным Android-приложением в кеш-директорию.
         Содержит window.__ALPHA_CONFIG__ = { serverUrl: "..." }.
         В bundled версии файла нет — молча игнорируется. -->
    <script src="settings.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
